spring.application.name=licoreria

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:licoreria_db}
spring.datasource.username=${POSTGRES_USER:licoreria_user}
spring.datasource.password=${POSTGRES_PASSWORD:licoreria_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

# Reduce N+1 query round-trips: batches lazy/associated entity loads into IN-clause queries
spring.jpa.properties.hibernate.default_batch_fetch_size=100

spring.h2.console.enabled=false

app.jwt.secret=esta-es-una-clave-secreta-mucho-mas-larga-y-segura-para-jwt-hs512-algoritmo-con-mas-de-64-bytes-para-licoreria-inventario-system-2026
app.jwt.expiration=604800000
server.port=8081
server.address=0.0.0.0

# Comprime las respuestas JSON grandes (dashboard/transacciones) antes de enviarlas por red
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/css,text/html,text/plain
server.compression.min-response-size=1024

app.cors.allowed-origins=http://localhost,http://localhost:4200,http://localhost:80,http://localhost:8081,https://koala-latticed-alike.ngrok-free.dev,https://*.ngrok-free.dev,http://173.212.244.36,http://173.212.244.36:80,http://173.212.244.36:8081

# Export configuration - uses project exports directory for file storage
export.file.path=./exports

# Product images path - uses project images directory
product.image.path=./product-images